name: warm-core

# Прогрев кеша ядра.
#
# Кеш GitHub виден прогону только со своего ref и с дефолтной ветки, а тег — отдельный
# ref: ядро, собранное на теге kelevra41, невидимо тегу kelevra42, и тот собирает его
# заново под тем же ключом (проверено: один ключ лежал в кеше по 3-5 копий, у каждой
# время последнего чтения равно времени записи — не прочитал никто).
#
# Правка ядра в dev (дефолтная ветка) один раз греет кеш, и все теги после неё стартуют
# сразу с APK: ~3 минуты на каждый тег.
#
# ПОЧЕМУ ЕЩЁ И РАСПИСАНИЕ. Пуша с правкой ядра мало: в ключ кеша входит SHA апстрима
# olcrtc, который двигается САМ, без единой правки в этом репозитории. Замерено по
# временам шагов CI (13.08.2026): 08.08 кеш ядра попал шесть прогонов подряд — job
# core не собирал ядро вовсе; 09.08 в 12:47Z в olcrtc/master приехал коммит b336808,
# ключ сменился, и с 10.08 все 20+ прогонов подряд собирают ядро заново. Греть было
# некому: своих файлов ядра с тех пор никто не трогал, а триггер слушает только их.
# Ядро — это ~9 минут в каждом теге, и job release ждёт его (needs: core).
# Расписание закрывает ровно этот разрыв: ключ уплыл сам — прогрев тоже идёт сам.
# Попадание в кеш стоит меньше минуты (все шаги сборки под `if: cache-hit != true`),
# так что холостой прогон почти бесплатен.
on:
  push:
    branches:
      - dev
    paths:
      - "cores/**"
      - "core-xhttp/**"
      - "core-olcrtc/**"
  # Каждые 6 часов: апстрим двигается раз в 1-2 суток, а теги идут пачками по 5-6 в
  # день — между движением апстрима и первым тегом после него должен успеть встать
  # прогрев. Расписание работает только с дефолтной ветки — это dev, то есть та самая
  # ветка, чей кеш видят теги.
  schedule:
    - cron: "0 */6 * * *"
  # Ручной запуск: чтобы прогрев можно было позвать сразу после правки апстрима,
  # не дожидаясь расписания, и чтобы эту ветку вообще можно было исполнить руками —
  # неисполнявшаяся ветка отказа не проверена ничем.
  # Оговорка вслух: при ручном запуске вызванный release.yml видит event_name
  # `workflow_dispatch` и, кроме ядра, соберёт ещё и APK (~8 минут). Публикации не
  # будет — шаг публикации там стоит только на пуш тега. По расписанию event_name
  # `schedule`, и APK не собирается: греется ровно ядро.
  workflow_dispatch:

# Два прогрева разом греют один ключ и мешают друг другу; релиз при этом не трогаем —
# ему ждать прогрева незачем, он собирает своё ядро сам, если кеша ещё нет.
concurrency:
  group: warm-core
  cancel-in-progress: false

jobs:
  warm:
    uses: ./.github/workflows/release.yml
    # Права нужны те же, что у вызываемого сценария: у него job релиза объявляет
    # contents: write, и вызов с одним чтением GitHub отклоняет ещё на старте —
    # прогон падает в startup_failure без единой строки лога (поймано 11.08.2026,
    # первое же срабатывание прогрева). Сам релиз тут всё равно не создаётся:
    # его job пускает только тег и ручной запуск.
    permissions:
      contents: write
