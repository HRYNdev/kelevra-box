name: build

on:
  workflow_dispatch:
    inputs:
      core_repo:
        description: "Репозиторий ядра (форк extended умеет xhttp, оригинал — нет)"
        required: false
        default: "SagerNet/sing-box"
      core_ref:
        description: "Тег/ветка ядра"
        required: false
        default: "v1.14.0-beta.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Приложение обязано лежать в папке с этим именем: build_libbox копирует
      # готовый .aar в ../sing-box-for-android/app/libs (см. cmd/internal/build_libbox/main.go)
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android
          submodules: recursive

      # Ядро зависит только от версии sing-box. Пока она та же — не пересобираем:
      # это разница между 15 минутами и парой минут на каждую правку в Kotlin.
      - name: Кеш ядра
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: sing-box-for-android/app/libs
          key: libbox-xhttp2-${{ github.event.inputs.core_ref || 'v1.14.0-beta.4' }}

      - name: Checkout sing-box core
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.inputs.core_repo || 'SagerNet/sing-box' }}
          ref: ${{ github.event.inputs.core_ref || 'v1.14.0-beta.4' }}
          path: sing-box
          fetch-depth: 0   # нужны теги: build_libbox читает currentTag из git

      - name: Setup Go
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"   # build_libbox проверяет версию и падает на всём, кроме 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;28.0.13004108"

      # наш транспорт xhttp: в апстриме его нет
      - name: Патч ядра
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: python3 sing-box-for-android/core-xhttp/apply.py sing-box

      - name: Install gomobile
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: make lib_install

      # build_libbox копирует .aar в ../sing-box-for-android/app/libs ТОЛЬКО если папка уже есть,
      # иначе молча оставляет файл у себя. В репозитории этой папки нет.
      - name: Создать app/libs
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: mkdir -p sing-box-for-android/app/libs

      - name: Build libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android

      - name: Проверка что ядро на месте
        run: |
          # подстраховка: если копирование не сработало, забираем сами
          for f in libbox.aar libbox-legacy.aar; do
            if [ ! -f "sing-box-for-android/app/libs/$f" ] && [ -f "sing-box/$f" ]; then
              cp "sing-box/$f" "sing-box-for-android/app/libs/$f"
            fi
          done
          ls -la sing-box-for-android/app/libs/
          test -f sing-box-for-android/app/libs/libbox.aar
          echo "кеш ядра: ${{ steps.libbox-cache.outputs.cache-hit == 'true' && 'попадание' || 'пересобрано' }}"

      - name: Подготовка подписи
        working-directory: sing-box-for-android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          # проект читает параметры подписи из base64-properties в LOCAL_PROPERTIES
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEYSTORE_PASS" > /tmp/local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 /tmp/local.properties)" >> $GITHUB_ENV
          rm -f /tmp/local.properties
          test -s app/release.keystore

      # только arm64: реальные телефоны в семье все на нём, universal собирается втрое дольше
      - name: Build APK
        working-directory: sing-box-for-android
        env:
          KELEVRA_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherRelease --no-daemon --stacktrace -Pabi=arm64-v8a


      # без этой проверки в релиз once уже уехало ядро без нашего транспорта
      - name: Проверка что транспорт в APK
        working-directory: sing-box-for-android
        run: |
          APK=$(find app/build/outputs/apk -name '*arm64*.apk' | head -1)
          test -n "$APK" || { echo "APK не найден"; exit 1; }
          mkdir -p /tmp/apkcheck && unzip -o -q "$APK" 'lib/*/libbox.so' -d /tmp/apkcheck
          SO=$(find /tmp/apkcheck -name libbox.so | head -1)
          if grep -qa 'v2rayxhttp' "$SO"; then
            echo "транспорт xhttp внутри APK: есть"
          else
            echo "ОШИБКА: в libbox.so нет транспорта xhttp — ядро собрано без патча"
            exit 1
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kelevra-apk
          path: sing-box-for-android/app/build/outputs/apk/**/*arm64*.apk
          if-no-files-found: error
