name: release

# Тег вида v1.14.0-beta.4-kelevra3 -> сборка + релиз с APK.
# Ядро берётся из кеша, если версия sing-box не менялась.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout app
        uses: actions/checkout@v4
        with:
          path: sing-box-for-android
          submodules: recursive

      - name: Кеш ядра
        id: libbox-cache
        uses: actions/cache@v4
        with:
          path: sing-box-for-android/app/libs
          key: libbox-v1.14.0-beta.4

      - name: Checkout sing-box core
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.14.0-beta.4
          path: sing-box
          fetch-depth: 0

      - name: Setup Go
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache-dependency-path: sing-box/go.sum

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: sdkmanager --install "ndk;28.0.13004108"

      - name: Install gomobile
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: make lib_install

      - name: Создать app/libs
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        run: mkdir -p sing-box-for-android/app/libs

      - name: Build libbox
        if: steps.libbox-cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/28.0.13004108"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          export PATH="$PATH:$(go env GOPATH)/bin"
          make lib_android

      - name: Проверка что ядро на месте
        run: |
          for f in libbox.aar libbox-legacy.aar; do
            if [ ! -f "sing-box-for-android/app/libs/$f" ] && [ -f "sing-box/$f" ]; then
              cp "sing-box/$f" "sing-box-for-android/app/libs/$f"
            fi
          done
          test -f sing-box-for-android/app/libs/libbox.aar

      - name: Подготовка подписи
        working-directory: sing-box-for-android
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > app/release.keystore
          printf 'KEYSTORE_PASS=%s\nALIAS_NAME=%s\nALIAS_PASS=%s\n' "$KEYSTORE_PASS" "$KEY_ALIAS" "$KEYSTORE_PASS" > /tmp/local.properties
          echo "LOCAL_PROPERTIES=$(base64 -w0 /tmp/local.properties)" >> $GITHUB_ENV
          rm -f /tmp/local.properties
          test -s app/release.keystore

      - name: Build APK
        working-directory: sing-box-for-android
        env:
          KELEVRA_BUILD: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleOtherRelease --no-daemon

      # приложение сравнивает версии по этому файлу в релизе
      - name: Метаданные версии
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          CODE=$(( 707 * 1000 + BUILD_NUMBER ))
          echo "{\"version_code\": $CODE, \"version_name\": \"1.14.$BUILD_NUMBER\"}" > kelevra-version.json
          cat kelevra-version.json

      - name: Публикация релиза
        uses: softprops/action-gh-release@v2
        with:
          files: |
            sing-box-for-android/app/build/outputs/apk/**/*arm64*.apk
            kelevra-version.json
          prerelease: false
          generate_release_notes: true
